<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>介護に関する入門的研修｜理解度チェック</title>
<style>
:root{--green:#477d35;--deep:#28552d;--pale:#f2f7ef;--line:#dce6d7;--ink:#253126;--muted:#687568}*{box-sizing:border-box}body{margin:0;background:#f5f7f4;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}header{background:linear-gradient(120deg,#28552d,#5b8e43);color:white;padding:22px 18px}header .wrap,main{max-width:900px;margin:auto}h1{font-size:clamp(21px,4vw,30px);margin:0 0 6px}header p{margin:0}main{padding:22px 14px 50px}.tabs{display:flex;gap:8px;margin-bottom:16px}.tab,.secondary{border:1px solid var(--line);background:white;color:var(--deep);padding:11px 16px;border-radius:10px;font-weight:700;cursor:pointer}.tab.active{background:var(--deep);color:white}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}label{display:block;font-weight:700;margin:12px 0 6px}input,select{width:100%;padding:13px;border:1px solid #cbd7c6;border-radius:9px;font:inherit;background:white}.primary{background:var(--green);color:white;border:0;padding:13px 20px;border-radius:10px;font-weight:700;cursor:pointer}.primary:disabled{opacity:.5}.small{color:var(--muted);font-size:13px}.hidden{display:none!important}.notice{padding:12px;background:var(--pale);border-radius:10px;color:var(--deep);margin:12px 0}.question{padding:17px 0;border-top:1px solid #edf1eb}.qtitle{font-weight:750;line-height:1.65;margin-bottom:10px}.choices{display:grid;gap:8px}.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:11px;cursor:pointer}.choice:has(input:checked){border-color:var(--green);background:var(--pale)}.choice input{width:auto;margin-top:5px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--pale);border-radius:12px;padding:13px}.stat strong{display:block;font-size:24px;color:var(--deep)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #edf1eb;white-space:nowrap}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.panel{padding:16px}}
</style></head><body><header><div class="wrap"><h1>介護に関する入門的研修</h1><p>理解度チェック</p></div></header><main>
<div class="tabs"><button class="tab active" id="testTab" onclick="tab('test')">受講者テスト</button><button class="tab" id="adminTab" onclick="tab('admin')">講師・集計画面</button></div>
<section id="testPanel"><div class="panel" id="intro"><h2>受験者情報</h2><p class="small">氏名と研修を選択してください。</p><label>氏名</label><input id="name" maxlength="60" placeholder="例：山田 太郎"><label>受講番号（任意）</label><input id="studentId" maxlength="40"><label>研修・テスト</label><select id="training"><option>読み込み中...</option></select><div class="notice" id="notice">研修設定を読み込んでいます。</div><button class="primary" id="start" onclick="startTest()" disabled>テストを開始する</button></div>
<div class="panel hidden" id="quiz"><div id="quizHead"></div><div id="questions"></div><button class="primary" id="submit" onclick="submitTest()">回答を送信する</button><p class="small">送信後の回答変更はできません。</p></div><div class="panel hidden" id="result"></div></section>
<section id="adminPanel" class="hidden"><div class="panel"><h2>講師用 集計画面</h2><label>管理パスワード</label><input type="password" id="password"><label>研修で絞り込む</label><select id="filter"><option value="">すべての研修</option></select><button class="primary" onclick="loadResults()">集計を読み込む</button><p class="small" id="adminMsg"></p></div><div id="dashboard" class="hidden"><div class="panel stats" id="stats"></div><div class="panel"><h3>受験者一覧</h3><button class="secondary" onclick="csv()">CSVダウンロード</button><div class="tablewrap"><table><thead><tr><th>受験日時</th><th>研修</th><th>氏名</th><th>受講番号</th><th>得点</th><th>合否</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></section></main>
<script>
const API='/.netlify/functions/gas';
const SUBMIT_API='https://script.google.com/macros/s/AKfycbya9RPyAa-OhsIPo59X5qvO-IPO_K6U1PVCkBOMz6ii1hpwbn_Y1Gu1rK9eMh7rCTIDCA/exec';
let trainings=[],trainingNow=null,questions=[],answers=[],records=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tab(v){testPanel.classList.toggle('hidden',v!=='test');adminPanel.classList.toggle('hidden',v!=='admin');testTab.classList.toggle('active',v==='test');adminTab.classList.toggle('active',v==='admin');}
function call(params){return new Promise((resolve,reject)=>{const cb='cb'+Date.now()+Math.floor(Math.random()*9999),s=document.createElement('script'),timer=setTimeout(()=>{delete window[cb];s.remove();reject(Error('通信がタイムアウトしました'));},12000);window[cb]=d=>{clearTimeout(timer);delete window[cb];s.remove();resolve(d);};s.onerror=()=>{clearTimeout(timer);delete window[cb];s.remove();reject(Error('接続に失敗しました。URL・公開設定を確認してください。'));};s.src=API+'?'+new URLSearchParams({...params,callback:cb});document.body.appendChild(s);});}
async function init(){try{const d=await call({action:'init'});if(!d.ok)throw Error(d.error);trainings=d.trainings||[];const opts=trainings.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}（${t.questionCount||'全'}問・合格${t.passScore}点）</option>`).join('');document.getElementById('training').innerHTML=opts||'<option value="">有効な研修なし</option>';document.getElementById('filter').innerHTML='<option value="">すべての研修</option>'+opts;document.getElementById('notice').textContent='研修を選択してテストを開始してください。';document.getElementById('start').disabled=!trainings.length;}catch(e){document.getElementById('notice').textContent=e.message;}}
async function startTest(){const n=document.getElementById('name').value.trim();if(!n)return alert('氏名を入力してください');trainingNow=trainings.find(t=>t.id===document.getElementById('training').value);if(!trainingNow)return alert('研修を選択してください');document.getElementById('start').disabled=true;try{const d=await call({action:'questions',trainingId:trainingNow.id});if(!d.ok)throw Error(d.error);questions=d.questions||[];if(!questions.length)throw Error('問題が登録されていません');answers=Array(questions.length).fill(null);document.getElementById('intro').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');document.getElementById('quizHead').innerHTML=`<h2>${esc(n)} さん</h2><p class="small">${esc(trainingNow.name)}｜全${questions.length}問</p>`;questionsEl=document.getElementById('questions');questionsEl.innerHTML=questions.map((q,i)=>`<div class="question"><div class="qtitle">第${i+1}問　${esc(q.question)}</div><div class="choices">${q.options.map((a,j)=>`<label class="choice"><input type="radio" name="q${i}" onchange="answers[${i}]=${j}"><span>${'ABCD'[j]}．${esc(a)}</span></label>`).join('')}</div></div>`).join('');scrollTo(0,0);}catch(e){alert(e.message);document.getElementById('start').disabled=false;}}
async function submitTest(){if(answers.some(v=>v===null))return alert('未回答の問題があります。');document.getElementById('submit').disabled=true;document.getElementById('submit').textContent='送信中...';const id=crypto.randomUUID().replace(/-/g,'');const record={submissionId:id,name:document.getElementById('name').value.trim(),studentId:document.getElementById('studentId').value.trim(),trainingId:trainingNow.id,answers:questions.map((q,i)=>({questionId:q.id,answer:answers[i]}))};try{await fetch(SUBMIT_API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'submit',record})});let d=null;for(let i=0;i<10;i++){await new Promise(r=>setTimeout(r,800));try{const x=await call({action:'result',id});if(x.ok){d=x;break;}}catch(e){}}if(!d)throw Error('送信結果を確認できません。講師に確認してください。');document.getElementById('quiz').classList.add('hidden');let h=`<h2>採点結果：${d.score}／${d.total}点</h2><div class="notice"><b>${d.passed?'合格':'不合格'}</b>｜合格基準：${d.passScore}点以上</div><p>${esc(record.name)} さん、お疲れさまでした。</p>`;if(d.details.length)h+='<h3>解説</h3>'+d.details.map((x,i)=>`<div class="question"><b>第${i+1}問：${x.correct?'正解':'不正解'}</b><p class="small">${esc(x.explanation)}</p></div>`).join('');h+='<button class="secondary" onclick="location.reload()">終了する</button>';document.getElementById('result').innerHTML=h;document.getElementById('result').classList.remove('hidden');scrollTo(0,0);}catch(e){alert(e.message);document.getElementById('submit').disabled=false;document.getElementById('submit').textContent='回答を送信する';}}
async function loadResults(){document.getElementById('adminMsg').textContent='読み込み中...';try{const d=await call({action:'list',password:document.getElementById('password').value,trainingId:document.getElementById('filter').value});if(!d.ok)throw Error(d.error);records=d.records||[];const n=records.length,avg=n?records.reduce((s,r)=>s+r.score,0)/n:0,pass=records.filter(r=>r.result==='合格').length;document.getElementById('stats').innerHTML=[['受験者数',n+'人'],['平均点',avg.toFixed(1)+'点'],['合格率',n?Math.round(pass/n*100)+'%':'0%']].map(x=>`<div class="stat"><span class="small">${x[0]}</span><strong>${x[1]}</strong></div>`).join('');document.getElementById('rows').innerHTML=records.slice().reverse().map(r=>`<tr><td>${esc(new Date(r.submittedAt).toLocaleString('ja-JP'))}</td><td>${esc(r.trainingName)}</td><td>${esc(r.name)}</td><td>${esc(r.studentId)}</td><td>${r.score}/${r.total}</td><td>${esc(r.result)}</td></tr>`).join('');document.getElementById('dashboard').classList.remove('hidden');document.getElementById('adminMsg').textContent='読み込み完了：'+n+'件';}catch(e){document.getElementById('adminMsg').textContent=e.message;}}
function csv(){const data=[['受験日時','研修名','氏名','受講番号','得点','満点','合否'],...records.map(r=>[r.submittedAt,r.trainingName,r.name,r.studentId,r.score,r.total,r.result])];const text='\\uFEFF'+data.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\\r\\n');const u=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='介護入門研修_集計.csv';a.click();URL.revokeObjectURL(u);}
init();
</script></body></html>
